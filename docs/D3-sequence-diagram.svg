<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="Helvetica, Arial, sans-serif">
  <style>
    .lifeline-label { font-size: 11.5px; fill: white; font-weight: bold; text-anchor: middle; }
    .lifeline-box { fill: #1a5d3a; }
    .lifeline { stroke: #999; stroke-width: 1; stroke-dasharray: 3,3; }
    .msg { stroke: #333; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    .msg-dashed { stroke: #333; stroke-width: 1.1; fill: none; stroke-dasharray: 4,3; marker-end: url(#arrow); }
    .msg-text { font-size: 10.5px; fill: #222; }
    .note { fill: #fff8e1; stroke: #e8a33d; stroke-width: 1; }
    .note-text { font-size: 10px; fill: #4a3200; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1180" height="900" fill="#f7f7f5"/>
  <text x="20" y="26" font-size="18" font-weight="bold" fill="#0f3d26">D3 - Place Order Sequence Diagram</text>
  <text x="20" y="44" font-size="11" fill="#666">POST /api/v1/orders/checkout - Browser through to H2, with rollback on insufficient stock</text>

  <!-- Lifelines (7 columns) -->
  <!-- x positions -->
  <!-- Buyer 60, Browser 200, AuthFilter 340, OrderServlet 480, OrderService 640, DAOs 820, DB 1050 -->

  <g id="headers" transform="translate(0,70)">
    <rect class="lifeline-box" x="20" width="90" height="28"/>
    <text class="lifeline-label" x="65" y="18">Buyer</text>

    <rect class="lifeline-box" x="150" width="110" height="28"/>
    <text class="lifeline-label" x="205" y="18">Browser (fetch)</text>

    <rect class="lifeline-box" x="300" width="100" height="28"/>
    <text class="lifeline-label" x="350" y="18">AuthFilter</text>

    <rect class="lifeline-box" x="440" width="110" height="28"/>
    <text class="lifeline-label" x="495" y="18">OrderServlet</text>

    <rect class="lifeline-box" x="590" width="110" height="28"/>
    <text class="lifeline-label" x="645" y="18">OrderService</text>

    <rect class="lifeline-box" x="740" width="160" height="28"/>
    <text class="lifeline-label" x="820" y="18">Cart/Product/OrderDAO</text>

    <rect class="lifeline-box" x="1010" width="120" height="28"/>
    <text class="lifeline-label" x="1070" y="18">H2 Database</text>
  </g>

  <!-- vertical lifelines -->
  <g transform="translate(0,98)">
    <line class="lifeline" x1="65" y1="0" x2="65" y2="780"/>
    <line class="lifeline" x1="205" y1="0" x2="205" y2="780"/>
    <line class="lifeline" x1="350" y1="0" x2="350" y2="780"/>
    <line class="lifeline" x1="495" y1="0" x2="495" y2="780"/>
    <line class="lifeline" x1="645" y1="0" x2="645" y2="780"/>
    <line class="lifeline" x1="820" y1="0" x2="820" y2="780"/>
    <line class="lifeline" x1="1070" y1="0" x2="1070" y2="780"/>
  </g>

  <g transform="translate(0,98)" font-family="Helvetica, Arial, sans-serif">
    <line class="msg" x1="65" y1="30" x2="205" y2="30"/>
    <text class="msg-text" x="70" y="26">1. Click "Place order"</text>

    <line class="msg" x1="205" y1="55" x2="350" y2="55"/>
    <text class="msg-text" x="210" y="51">2. POST /orders/checkout (session cookie)</text>

    <line class="msg" x1="350" y1="80" x2="495" y2="80"/>
    <text class="msg-text" x="355" y="76">3. session valid -&gt; forward</text>

    <line class="msg" x1="495" y1="105" x2="645" y2="105"/>
    <text class="msg-text" x="500" y="101">4. checkout(buyerId, mockPaymentConfirmed=true)</text>

    <line class="msg" x1="645" y1="135" x2="820" y2="135"/>
    <text class="msg-text" x="650" y="131">5. findByUser(buyerId)</text>
    <line class="msg" x1="820" y1="160" x2="1070" y2="160"/>
    <text class="msg-text" x="825" y="156">6. SELECT cart_items JOIN products</text>
    <line class="msg-dashed" x1="1070" y1="185" x2="820" y2="185"/>
    <text class="msg-text" x="825" y="181">7. rows</text>
    <line class="msg-dashed" x1="820" y1="210" x2="645" y2="210"/>
    <text class="msg-text" x="650" y="206">8. List&lt;CartItem&gt;</text>

    <rect class="note" x="600" y="222" width="260" height="26"/>
    <text class="note-text" x="608" y="239">compute total; conn.setAutoCommit(false)</text>

    <line class="msg" x1="645" y1="270" x2="820" y2="270"/>
    <text class="msg-text" x="650" y="266">9. insert(conn, order)</text>
    <line class="msg" x1="820" y1="295" x2="1070" y2="295"/>
    <text class="msg-text" x="825" y="291">10. INSERT INTO orders</text>
    <line class="msg-dashed" x1="1070" y1="320" x2="820" y2="320"/>
    <text class="msg-text" x="825" y="316">11. generated order id</text>
    <line class="msg-dashed" x1="820" y1="345" x2="645" y2="345"/>
    <text class="msg-text" x="650" y="341">12. Order(id)</text>

    <rect class="note" x="600" y="357" width="330" height="26"/>
    <text class="note-text" x="608" y="374">loop for each cart item:</text>

    <line class="msg" x1="645" y1="405" x2="820" y2="405"/>
    <text class="msg-text" x="650" y="401">13. adjustStock(conn, productId, -qty)</text>
    <line class="msg" x1="820" y1="430" x2="1070" y2="430"/>
    <text class="msg-text" x="825" y="426">14. UPDATE products SET stock_qty=stock_qty-qty WHERE stock_qty-qty&gt;=0</text>
    <line class="msg-dashed" x1="1070" y1="455" x2="820" y2="455"/>
    <text class="msg-text" x="825" y="451">15. rows updated (0 or 1)</text>
    <line class="msg-dashed" x1="820" y1="480" x2="645" y2="480"/>
    <text class="msg-text" x="650" y="476">16. true/false</text>

    <rect class="note" x="20" y="492" width="500" height="30" fill="#ffe8e8" stroke="#b3261e"/>
    <text class="note-text" x="28" y="510" fill="#7a1a15">ALT insufficient stock -&gt; conn.rollback(); throw ConflictException -&gt; 409 to Browser</text>

    <line class="msg" x1="645" y1="540" x2="820" y2="540"/>
    <text class="msg-text" x="650" y="536">17. insertItem(conn, orderId, productId, qty, unitPrice)</text>
    <line class="msg" x1="820" y1="565" x2="1070" y2="565"/>
    <text class="msg-text" x="825" y="561">18. INSERT INTO order_items</text>

    <line class="msg" x1="645" y1="600" x2="820" y2="600"/>
    <text class="msg-text" x="650" y="596">19. clear(conn, buyerId)</text>
    <line class="msg" x1="820" y1="625" x2="1070" y2="625"/>
    <text class="msg-text" x="825" y="621">20. DELETE FROM cart_items WHERE user_id=?</text>

    <rect class="note" x="600" y="637" width="200" height="26"/>
    <text class="note-text" x="608" y="654">conn.commit()</text>

    <line class="msg" x1="645" y1="680" x2="820" y2="680"/>
    <text class="msg-text" x="650" y="676">21. findById(orderId)</text>
    <line class="msg" x1="820" y1="700" x2="1070" y2="700"/>
    <text class="msg-text" x="825" y="696">22. SELECT order + order_items</text>
    <line class="msg-dashed" x1="1070" y1="720" x2="820" y2="720"/>
    <line class="msg-dashed" x1="820" y1="738" x2="645" y2="738"/>
    <text class="msg-text" x="650" y="734">23. full Order</text>

    <line class="msg-dashed" x1="645" y1="758" x2="495" y2="758"/>
    <text class="msg-text" x="500" y="754">24. OrderConfirmationDTO</text>
    <line class="msg-dashed" x1="495" y1="778" x2="205" y2="778"/>
    <text class="msg-text" x="210" y="774">25. 201 { success:true, data: {...} }</text>
  </g>
  <text x="20" y="890" font-size="11" fill="#666">Source: docs/D3-sequence-diagram.puml</text>
</svg>
