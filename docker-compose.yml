version: "3.8"

services:
  h2:
    build:
      context: .
      dockerfile: Dockerfile.h2
    ports:
      - "9092:9092"
    volumes:
      - h2-data:/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:h2:tcp://h2:9092/./krishvamart
      DB_USER: sa
      DB_PASSWORD: ""
      AI_CHATBOT_PROVIDER: mock
      AI_CHATBOT_API_KEY: ""
    depends_on:
      - h2
    restart: unless-stopped

volumes:
  h2-data:
